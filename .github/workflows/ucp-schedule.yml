name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '31 5 7 11 *'   # 2026-11-07-0831-sklady-vacancy-q3.json · пост
    - cron: '56 5 7 11 *'   # 2026-11-07-0831-sklady-vacancy-q3.json · страховка
    - cron: '52 6 7 11 *'   # 2026-11-07-0952-wisdom-smirnova-salary.json · пост
    - cron: '17 7 7 11 *'   # 2026-11-07-0952-wisdom-smirnova-salary.json · страховка
    - cron: '53 7 7 11 *'   # 2026-11-07-1053-repost-walmart-amazon.json · пост
    - cron: '18 8 7 11 *'   # 2026-11-07-1053-repost-walmart-amazon.json · страховка
    - cron: '21 9 7 11 *'   # 2026-11-07-1221-china-containers-november.json · пост
    - cron: '46 9 7 11 *'   # 2026-11-07-1221-china-containers-november.json · страховка
    - cron: '29 10 7 11 *'   # 2026-11-07-1329-retail-magnit-tomatoes.json · пост
    - cron: '54 10 7 11 *'   # 2026-11-07-1329-retail-magnit-tomatoes.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
