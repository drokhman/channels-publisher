name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '41 5 5 11 *'   # 2026-11-05-0841-retail-traffic-down.json · пост
    - cron: '6 6 5 11 *'   # 2026-11-05-0841-retail-traffic-down.json · страховка
    - cron: '44 6 5 11 *'   # 2026-11-05-0944-bp-process-mining.json · пост
    - cron: '9 7 5 11 *'   # 2026-11-05-0944-bp-process-mining.json · страховка
    - cron: '3 8 5 11 *'   # 2026-11-05-1103-repost-doverie.json · пост
    - cron: '28 8 5 11 *'   # 2026-11-05-1103-repost-doverie.json · страховка
    - cron: '4 9 5 11 *'   # 2026-11-05-1204-ai-data-incidents.json · пост
    - cron: '29 9 5 11 *'   # 2026-11-05-1204-ai-data-incidents.json · страховка
    - cron: '12 10 5 11 *'   # 2026-11-05-1312-little-law.json · пост
    - cron: '37 10 5 11 *'   # 2026-11-05-1312-little-law.json · страховка
    - cron: '36 11 5 11 *'   # 2026-11-05-1436-chz-outage.json · пост
    - cron: '1 12 5 11 *'   # 2026-11-05-1436-chz-outage.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
