name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '1 5 11 11 *'   # 2026-11-11-0801-retail-fas-discrimination.json · пост
    - cron: '26 5 11 11 *'   # 2026-11-11-0801-retail-fas-discrimination.json · страховка
    - cron: '24 6 11 11 *'   # 2026-11-11-0924-theory-games-01-dilemma.json · пост
    - cron: '49 6 11 11 *'   # 2026-11-11-0924-theory-games-01-dilemma.json · страховка
    - cron: '54 7 11 11 *'   # 2026-11-11-1054-repost-x5-contracts-agent.json · пост
    - cron: '19 8 11 11 *'   # 2026-11-11-1054-repost-x5-contracts-agent.json · страховка
    - cron: '58 8 11 11 *'   # 2026-11-11-1158-marking-fake-producers.json · пост
    - cron: '23 9 11 11 *'   # 2026-11-11-1158-marking-fake-producers.json · страховка
    - cron: '59 9 11 11 *'   # 2026-11-11-1259-drewry-suez-return.json · пост
    - cron: '24 10 11 11 *'   # 2026-11-11-1259-drewry-suez-return.json · страховка
    - cron: '23 11 11 11 *'   # 2026-11-11-1423-pvz-ymarket-cdek.json · пост
    - cron: '48 11 11 11 *'   # 2026-11-11-1423-pvz-ymarket-cdek.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
