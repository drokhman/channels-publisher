name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '26 15 22 11 *'   # 2026-11-22-1826-ii-pribyl-04-speshka.json · пост
    - cron: '29 15 22 11 *'   # 2026-11-22-1829-ii-pribyl-04-speshka-dzen.json · пост
    - cron: '38 16 22 11 *'   # 2026-11-22-1938-ii-pribyl-05-lozhnaya-cel.json · пост
    - cron: '41 16 22 11 *'   # 2026-11-22-1941-ii-pribyl-05-lozhnaya-cel-dzen.json · пост
    - cron: '58 5 23 11 *'   # 2026-11-23-0858-magnit-yandex-robotrucks.json · пост
    - cron: '16 7 23 11 *'   # 2026-11-23-1016-theory-games-05-coordination.json · пост
    - cron: '27 8 23 11 *'   # 2026-11-23-1127-wisdom-bushuev-sla.json · пост
    - cron: '42 9 23 11 *'   # 2026-11-23-1242-repost-transport-plan.json · пост
    - cron: '52 10 23 11 *'   # 2026-11-23-1352-bp-ishikawa.json · пост
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
