name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '48 7 12 11 *'   # 2026-11-12-1048-webinar-dbp-series.json · пост
    - cron: '13 8 12 11 *'   # 2026-11-12-1048-webinar-dbp-series.json · страховка
    - cron: '30 8 12 11 *'   # 2026-11-12-1130-repost-ai-hiring.json · пост
    - cron: '55 8 12 11 *'   # 2026-11-12-1130-repost-ai-hiring.json · страховка
    - cron: '58 9 12 11 *'   # 2026-11-12-1258-release-0593-open-search-bpmn.json · пост
    - cron: '23 10 12 11 *'   # 2026-11-12-1258-release-0593-open-search-bpmn.json · страховка
    - cron: '19 11 12 11 *'   # 2026-11-12-1419-wisdom-myakin-meetings.json · пост
    - cron: '44 11 12 11 *'   # 2026-11-12-1419-wisdom-myakin-meetings.json · страховка
    - cron: '41 12 12 11 *'   # 2026-11-12-1541-bp-five-whys.json · пост
    - cron: '6 13 12 11 *'   # 2026-11-12-1541-bp-five-whys.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
