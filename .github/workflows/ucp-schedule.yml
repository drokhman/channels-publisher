name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '45 5 28 10 *'   # 2026-10-28-0845-nov1-marking.json · пост
    - cron: '10 6 28 10 *'   # 2026-10-28-0845-nov1-marking.json · страховка
    - cron: '56 6 28 10 *'   # 2026-10-28-0956-fridge-cyber.json · пост
    - cron: '21 7 28 10 *'   # 2026-10-28-0956-fridge-cyber.json · страховка
    - cron: '12 8 28 10 *'   # 2026-10-28-1112-repost-boring-ai.json · пост
    - cron: '37 8 28 10 *'   # 2026-10-28-1112-repost-boring-ai.json · страховка
    - cron: '16 9 28 10 *'   # 2026-10-28-1216-staff-shortage.json · пост
    - cron: '41 9 28 10 *'   # 2026-10-28-1216-staff-shortage.json · страховка
    - cron: '46 10 28 10 *'   # 2026-10-28-1346-release-0515.json · пост
    - cron: '11 11 28 10 *'   # 2026-10-28-1346-release-0515.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
