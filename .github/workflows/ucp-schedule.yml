name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '42 5 9 11 *'   # 2026-11-09-0842-retail-cosmetics-assortment.json · пост
    - cron: '7 6 9 11 *'   # 2026-11-09-0842-retail-cosmetics-assortment.json · страховка
    - cron: '3 7 9 11 *'   # 2026-11-09-1003-wisdom-polyakov-peak.json · пост
    - cron: '28 7 9 11 *'   # 2026-11-09-1003-wisdom-polyakov-peak.json · страховка
    - cron: '6 8 9 11 *'   # 2026-11-09-1106-repost-shipstation-agents.json · пост
    - cron: '31 8 9 11 *'   # 2026-11-09-1106-repost-shipstation-agents.json · страховка
    - cron: '24 9 9 11 *'   # 2026-11-09-1224-bp-reglament-observe.json · пост
    - cron: '49 9 9 11 *'   # 2026-11-09-1224-bp-reglament-observe.json · страховка
    - cron: '37 10 9 11 *'   # 2026-11-09-1337-spb-containers.json · пост
    - cron: '2 11 9 11 *'   # 2026-11-09-1337-spb-containers.json · страховка
    - cron: '54 11 9 11 *'   # 2026-11-09-1454-marking-dairy-oil.json · пост
    - cron: '19 12 9 11 *'   # 2026-11-09-1454-marking-dairy-oil.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
