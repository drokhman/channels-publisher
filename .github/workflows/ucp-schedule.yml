name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '59 5 6 11 *'   # 2026-11-06-0859-south-rates.json · пост
    - cron: '24 6 6 11 *'   # 2026-11-06-0859-south-rates.json · страховка
    - cron: '20 7 6 11 *'   # 2026-11-06-1020-retail-ymarket-fby.json · пост
    - cron: '45 7 6 11 *'   # 2026-11-06-1020-retail-ymarket-fby.json · страховка
    - cron: '36 8 6 11 *'   # 2026-11-06-1136-repost-mif-vremya.json · пост
    - cron: '1 9 6 11 *'   # 2026-11-06-1136-repost-mif-vremya.json · страховка
    - cron: '1 10 6 11 *'   # 2026-11-06-1301-us-lmi-october.json · пост
    - cron: '26 10 6 11 *'   # 2026-11-06-1301-us-lmi-october.json · страховка
    - cron: '17 11 6 11 *'   # 2026-11-06-1417-release-0563.json · пост
    - cron: '42 11 6 11 *'   # 2026-11-06-1417-release-0563.json · страховка
    - cron: '40 12 6 11 *'   # 2026-11-06-1540-autostore-logiqs.json · пост
    - cron: '5 13 6 11 *'   # 2026-11-06-1540-autostore-logiqs.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
