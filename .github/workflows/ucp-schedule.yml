name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '52 5 26 11 *'   # 2026-11-26-0852-import-opt-17.json · пост
    - cron: '24 7 26 11 *'   # 2026-11-26-1024-release-05139-stellazh-roliki.json · пост
    - cron: '2 9 26 11 *'   # 2026-11-26-1202-toyota-practice-01-deshevye-pozicii.json · пост
    - cron: '34 10 26 11 *'   # 2026-11-26-1334-ai-easy-01-protokoly.json · пост
    - cron: '37 12 26 11 *'   # 2026-11-26-1537-merch-c-01-gruppa-c.json · пост
    - cron: '59 13 26 11 *'   # 2026-11-26-1659-poddony-vozvrat.json · пост
    - cron: '43 12 27 11 *'   # 2026-11-27-1543-merch-c-02-mesto-c.json · пост
    - cron: '46 12 28 11 *'   # 2026-11-28-1546-merch-c-03-karies.json · пост
    - cron: '52 12 29 11 *'   # 2026-11-29-1552-merch-c-04-svoi-strategii.json · пост
    - cron: '7 9 1 12 *'   # 2026-12-01-1207-toyota-practice-02-milk-run.json · пост
    - cron: '59 8 3 12 *'   # 2026-12-03-1159-toyota-practice-03-andon-priemka.json · пост
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*4)); done; exit 1)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*4)); done; exit 1)
