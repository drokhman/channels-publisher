name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '18 5 1 11 *'   # 2026-11-01-0818-oil-per-unit.json · пост
    - cron: '43 5 1 11 *'   # 2026-11-01-0818-oil-per-unit.json · страховка
    - cron: '48 6 1 11 *'   # 2026-11-01-0948-bp-dont-automate.json · пост
    - cron: '13 7 1 11 *'   # 2026-11-01-0948-bp-dont-automate.json · страховка
    - cron: '5 8 1 11 *'   # 2026-11-01-1105-repost-klarna.json · пост
    - cron: '30 8 1 11 *'   # 2026-11-01-1105-repost-klarna.json · страховка
    - cron: '23 9 1 11 *'   # 2026-11-01-1223-wisdom-two-questions.json · пост
    - cron: '48 9 1 11 *'   # 2026-11-01-1223-wisdom-two-questions.json · страховка
    - cron: '49 10 1 11 *'   # 2026-11-01-1349-release-bpd-quality.json · пост
    - cron: '14 11 1 11 *'   # 2026-11-01-1349-release-bpd-quality.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
