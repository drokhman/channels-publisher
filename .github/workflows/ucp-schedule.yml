name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '19 5 13 11 *'   # 2026-11-13-0819-ozon-fbs-fines.json · пост
    - cron: '44 5 13 11 *'   # 2026-11-13-0819-ozon-fbs-fines.json · страховка
    - cron: '31 6 13 11 *'   # 2026-11-13-0931-theory-stat-01-sample.json · пост
    - cron: '56 6 13 11 *'   # 2026-11-13-0931-theory-stat-01-sample.json · страховка
    - cron: '38 7 13 11 *'   # 2026-11-13-1038-rspp-logistics-index.json · пост
    - cron: '3 8 13 11 *'   # 2026-11-13-1038-rspp-logistics-index.json · страховка
    - cron: '0 9 13 11 *'   # 2026-11-13-1200-repost-ai-agent-wallet.json · пост
    - cron: '25 9 13 11 *'   # 2026-11-13-1200-repost-ai-agent-wallet.json · страховка
    - cron: '26 10 13 11 *'   # 2026-11-13-1326-tech-fee-electronics.json · пост
    - cron: '51 10 13 11 *'   # 2026-11-13-1326-tech-fee-electronics.json · страховка
    - cron: '39 11 13 11 *'   # 2026-11-13-1439-sber-warehouses-marketplaces.json · пост
    - cron: '4 12 13 11 *'   # 2026-11-13-1439-sber-warehouses-marketplaces.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
