name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '6 5 14 11 *'   # 2026-11-14-0806-sklady-record-deals.json · пост
    - cron: '31 5 14 11 *'   # 2026-11-14-0806-sklady-record-deals.json · страховка
    - cron: '32 6 14 11 *'   # 2026-11-14-0932-theory-games-02-two-thirds.json · пост
    - cron: '57 6 14 11 *'   # 2026-11-14-0932-theory-games-02-two-thirds.json · страховка
    - cron: '50 7 14 11 *'   # 2026-11-14-1050-marking-autoparts.json · пост
    - cron: '15 8 14 11 *'   # 2026-11-14-1050-marking-autoparts.json · страховка
    - cron: '13 9 14 11 *'   # 2026-11-14-1213-repost-manager-shock-absorber.json · пост
    - cron: '38 9 14 11 *'   # 2026-11-14-1213-repost-manager-shock-absorber.json · страховка
    - cron: '40 10 14 11 *'   # 2026-11-14-1340-release-05100-planogram-projects.json · пост
    - cron: '5 11 14 11 *'   # 2026-11-14-1340-release-05100-planogram-projects.json · страховка
    - cron: '0 12 14 11 *'   # 2026-11-14-1500-drewry-blank-sailings.json · пост
    - cron: '25 12 14 11 *'   # 2026-11-14-1500-drewry-blank-sailings.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
