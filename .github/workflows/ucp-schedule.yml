name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '11 5 27 10 *'   # 2026-10-27-0811-wci.json · пост
    - cron: '36 5 27 10 *'   # 2026-10-27-0811-wci.json · страховка
    - cron: '30 6 27 10 *'   # 2026-10-27-0930-warehouse-q3.json · пост
    - cron: '55 6 27 10 *'   # 2026-10-27-0930-warehouse-q3.json · страховка
    - cron: '32 7 27 10 *'   # 2026-10-27-1032-road-registry.json · пост
    - cron: '57 7 27 10 *'   # 2026-10-27-1032-road-registry.json · страховка
    - cron: '52 8 27 10 *'   # 2026-10-27-1152-book-goal.json · пост
    - cron: '17 9 27 10 *'   # 2026-10-27-1152-book-goal.json · страховка
    - cron: '16 10 27 10 *'   # 2026-10-27-1316-repost-osa.json · пост
    - cron: '41 10 27 10 *'   # 2026-10-27-1316-repost-osa.json · страховка
    - cron: '29 11 27 10 *'   # 2026-10-27-1429-release-0512.json · пост
    - cron: '54 11 27 10 *'   # 2026-10-27-1429-release-0512.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
