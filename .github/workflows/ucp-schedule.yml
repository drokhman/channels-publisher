name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '54 5 10 11 *'   # 2026-11-10-0854-rates-peak-down.json · пост
    - cron: '19 6 10 11 *'   # 2026-11-10-0854-rates-peak-down.json · страховка
    - cron: '13 7 10 11 *'   # 2026-11-10-1013-wisdom-koroy-backup-route.json · пост
    - cron: '38 7 10 11 *'   # 2026-11-10-1013-wisdom-koroy-backup-route.json · страховка
    - cron: '29 8 10 11 *'   # 2026-11-10-1129-repost-gartner-rehire.json · пост
    - cron: '54 8 10 11 *'   # 2026-11-10-1129-repost-gartner-rehire.json · страховка
    - cron: '46 9 10 11 *'   # 2026-11-10-1246-release-0572-projects-diagnostics.json · пост
    - cron: '11 10 10 11 *'   # 2026-11-10-1246-release-0572-projects-diagnostics.json · страховка
    - cron: '7 11 10 11 *'   # 2026-11-10-1407-retail-hr-deficit.json · пост
    - cron: '32 11 10 11 *'   # 2026-11-10-1407-retail-hr-deficit.json · страховка
    - cron: '24 12 10 11 *'   # 2026-11-10-1524-bp-order-before-ai.json · пост
    - cron: '49 12 10 11 *'   # 2026-11-10-1524-bp-order-before-ai.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
