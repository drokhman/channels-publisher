name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '3 5 4 11 *'   # 2026-11-04-0803-rspp-logistics-index.json · пост
    - cron: '28 5 4 11 *'   # 2026-11-04-0803-rspp-logistics-index.json · страховка
    - cron: '19 6 4 11 *'   # 2026-11-04-0919-bts-regions.json · пост
    - cron: '44 6 4 11 *'   # 2026-11-04-0919-bts-regions.json · страховка
    - cron: '36 7 4 11 *'   # 2026-11-04-1036-repost-novabev-osa.json · пост
    - cron: '1 8 4 11 *'   # 2026-11-04-1036-repost-novabev-osa.json · страховка
    - cron: '43 8 4 11 *'   # 2026-11-04-1143-walmart-symbotic.json · пост
    - cron: '8 9 4 11 *'   # 2026-11-04-1143-walmart-symbotic.json · страховка
    - cron: '10 10 4 11 *'   # 2026-11-04-1310-wisdom-logistics-in-price.json · пост
    - cron: '35 10 4 11 *'   # 2026-11-04-1310-wisdom-logistics-in-price.json · страховка
    - cron: '31 11 4 11 *'   # 2026-11-04-1431-release-0557.json · пост
    - cron: '56 11 4 11 *'   # 2026-11-04-1431-release-0557.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
