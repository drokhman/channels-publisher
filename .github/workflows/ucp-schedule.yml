name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '7 5 16 11 *'   # 2026-11-16-0807-baltic-port-costs.json · пост
    - cron: '32 5 16 11 *'   # 2026-11-16-0807-baltic-port-costs.json · страховка
    - cron: '20 6 16 11 *'   # 2026-11-16-0920-theory-stat-02-average.json · пост
    - cron: '45 6 16 11 *'   # 2026-11-16-0920-theory-stat-02-average.json · страховка
    - cron: '47 7 16 11 *'   # 2026-11-16-1047-release-05101-event-bot.json · пост
    - cron: '12 8 16 11 *'   # 2026-11-16-1047-release-05101-event-bot.json · страховка
    - cron: '6 9 16 11 *'   # 2026-11-16-1206-repost-zalando-returns.json · пост
    - cron: '31 9 16 11 *'   # 2026-11-16-1206-repost-zalando-returns.json · страховка
    - cron: '21 10 16 11 *'   # 2026-11-16-1321-wisdom-vinogradova-hiring.json · пост
    - cron: '46 10 16 11 *'   # 2026-11-16-1321-wisdom-vinogradova-hiring.json · страховка
    - cron: '44 11 16 11 *'   # 2026-11-16-1444-bp-sipoc.json · пост
    - cron: '9 12 16 11 *'   # 2026-11-16-1444-bp-sipoc.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
