name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '4 5 18 11 *'   # 2026-11-18-0804-far-east-container-imbalance.json · пост
    - cron: '29 5 18 11 *'   # 2026-11-18-0804-far-east-container-imbalance.json · страховка
    - cron: '10 6 18 11 *'   # 2026-11-18-0910-theory-bias-03-substitution.json · пост
    - cron: '35 6 18 11 *'   # 2026-11-18-0910-theory-bias-03-substitution.json · страховка
    - cron: '37 7 18 11 *'   # 2026-11-18-1037-retail-innov-amazon-just-walk-out.json · пост
    - cron: '2 8 18 11 *'   # 2026-11-18-1037-retail-innov-amazon-just-walk-out.json · страховка
    - cron: '57 8 18 11 *'   # 2026-11-18-1157-repost-flowwow-agent.json · пост
    - cron: '22 9 18 11 *'   # 2026-11-18-1157-repost-flowwow-agent.json · страховка
    - cron: '19 10 18 11 *'   # 2026-11-18-1319-release-05113-tools-steps.json · пост
    - cron: '44 10 18 11 *'   # 2026-11-18-1319-release-05113-tools-steps.json · страховка
    - cron: '30 11 18 11 *'   # 2026-11-18-1430-bp-value-stream-map.json · пост
    - cron: '55 11 18 11 *'   # 2026-11-18-1430-bp-value-stream-map.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
