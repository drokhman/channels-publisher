name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '17 5 31 10 *'   # 2026-10-31-0817-suez-return.json · пост
    - cron: '42 5 31 10 *'   # 2026-10-31-0817-suez-return.json · страховка
    - cron: '35 6 31 10 *'   # 2026-10-31-0935-apvgk.json · пост
    - cron: '0 7 31 10 *'   # 2026-10-31-0935-apvgk.json · страховка
    - cron: '44 7 31 10 *'   # 2026-10-31-1044-repost-uber-kroger.json · пост
    - cron: '9 8 31 10 *'   # 2026-10-31-1044-repost-uber-kroger.json · страховка
    - cron: '54 8 31 10 *'   # 2026-10-31-1154-wb-lease-warehouses.json · пост
    - cron: '19 9 31 10 *'   # 2026-10-31-1154-wb-lease-warehouses.json · страховка
    - cron: '18 10 31 10 *'   # 2026-10-31-1318-book-machine.json · пост
    - cron: '43 10 31 10 *'   # 2026-10-31-1318-book-machine.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
