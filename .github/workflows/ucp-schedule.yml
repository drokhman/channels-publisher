name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '47 5 17 11 *'   # 2026-11-17-0847-magnit-cpfr-pilot.json · пост
    - cron: '12 6 17 11 *'   # 2026-11-17-0847-magnit-cpfr-pilot.json · страховка
    - cron: '57 6 17 11 *'   # 2026-11-17-0957-theory-games-03-median-voter.json · пост
    - cron: '22 7 17 11 *'   # 2026-11-17-0957-theory-games-03-median-voter.json · страховка
    - cron: '0 8 17 11 *'   # 2026-11-17-1100-zabaikalsk-queue.json · пост
    - cron: '25 8 17 11 *'   # 2026-11-17-1100-zabaikalsk-queue.json · страховка
    - cron: '5 9 17 11 *'   # 2026-11-17-1205-repost-gxo-humanoids.json · пост
    - cron: '30 9 17 11 *'   # 2026-11-17-1205-repost-gxo-humanoids.json · страховка
    - cron: '35 10 17 11 *'   # 2026-11-17-1335-wisdom-ryzhenkov-shipper.json · пост
    - cron: '0 11 17 11 *'   # 2026-11-17-1335-wisdom-ryzhenkov-shipper.json · страховка
    - cron: '56 11 17 11 *'   # 2026-11-17-1456-north-supply-list.json · пост
    - cron: '21 12 17 11 *'   # 2026-11-17-1456-north-supply-list.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
