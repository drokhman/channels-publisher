name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '13 5 3 11 *'   # 2026-11-03-0813-rzd-october.json · пост
    - cron: '38 5 3 11 *'   # 2026-11-03-0813-rzd-october.json · страховка
    - cron: '17 6 3 11 *'   # 2026-11-03-0917-fas-undersupply.json · пост
    - cron: '42 6 3 11 *'   # 2026-11-03-0917-fas-undersupply.json · страховка
    - cron: '45 7 3 11 *'   # 2026-11-03-1045-repost-deloitte.json · пост
    - cron: '10 8 3 11 *'   # 2026-11-03-1045-repost-deloitte.json · страховка
    - cron: '12 9 3 11 *'   # 2026-11-03-1212-bp-fpy.json · пост
    - cron: '37 9 3 11 *'   # 2026-11-03-1212-bp-fpy.json · страховка
    - cron: '28 10 3 11 *'   # 2026-11-03-1328-book-ohno.json · пост
    - cron: '53 10 3 11 *'   # 2026-11-03-1328-book-ohno.json · страховка
    - cron: '48 11 3 11 *'   # 2026-11-03-1448-kpi-otif.json · пост
    - cron: '13 12 3 11 *'   # 2026-11-03-1448-kpi-otif.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
