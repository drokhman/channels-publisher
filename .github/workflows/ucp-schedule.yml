name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '35 7 15 11 *'   # 2026-11-15-1035-south-rates-cooling.json · пост
    - cron: '0 8 15 11 *'   # 2026-11-15-1035-south-rates-cooling.json · страховка
    - cron: '38 8 15 11 *'   # 2026-11-15-1138-repost-penske-invoices.json · пост
    - cron: '3 9 15 11 *'   # 2026-11-15-1138-repost-penske-invoices.json · страховка
    - cron: '48 9 15 11 *'   # 2026-11-15-1248-vats-law.json · пост
    - cron: '13 10 15 11 *'   # 2026-11-15-1248-vats-law.json · страховка
    - cron: '8 11 15 11 *'   # 2026-11-15-1408-book-goldratt-goal.json · пост
    - cron: '33 11 15 11 *'   # 2026-11-15-1408-book-goldratt-goal.json · страховка
    - cron: '18 7 16 11 *'   # 2026-11-16-1018-retail-lenta-lifi.json · пост
    - cron: '43 7 16 11 *'   # 2026-11-16-1018-retail-lenta-lifi.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
