name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '0 5 30 10 *'   # 2026-10-30-0800-lenta-remi-remote-qc.json · пост
    - cron: '25 5 30 10 *'   # 2026-10-30-0800-lenta-remi-remote-qc.json · страховка
    - cron: '4 6 30 10 *'   # 2026-10-30-0904-returns-bill.json · пост
    - cron: '29 6 30 10 *'   # 2026-10-30-0904-returns-bill.json · страховка
    - cron: '14 7 30 10 *'   # 2026-10-30-1014-repost-tasks-before-ai.json · пост
    - cron: '39 7 30 10 *'   # 2026-10-30-1014-repost-tasks-before-ai.json · страховка
    - cron: '39 8 30 10 *'   # 2026-10-30-1139-bullwhip.json · пост
    - cron: '4 9 30 10 *'   # 2026-10-30-1139-bullwhip.json · страховка
    - cron: '7 10 30 10 *'   # 2026-10-30-1307-release-bpd.json · пост
    - cron: '32 10 30 10 *'   # 2026-10-30-1307-release-bpd.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
