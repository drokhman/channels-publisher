name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '37 5 8 11 *'   # 2026-11-08-0837-apple-memory-commitments.json · пост
    - cron: '2 6 8 11 *'   # 2026-11-08-0837-apple-memory-commitments.json · страховка
    - cron: '51 6 8 11 *'   # 2026-11-08-0951-kpi-abc-xyz.json · пост
    - cron: '16 7 8 11 *'   # 2026-11-08-0951-kpi-abc-xyz.json · страховка
    - cron: '56 7 8 11 *'   # 2026-11-08-1056-repost-chrobinson-rates.json · пост
    - cron: '21 8 8 11 *'   # 2026-11-08-1056-repost-chrobinson-rates.json · страховка
    - cron: '9 9 8 11 *'   # 2026-11-08-1209-release-0565-domain.json · пост
    - cron: '34 9 8 11 *'   # 2026-11-08-1209-release-0565-domain.json · страховка
    - cron: '25 10 8 11 *'   # 2026-11-08-1325-book-christopher.json · пост
    - cron: '50 10 8 11 *'   # 2026-11-08-1325-book-christopher.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
      - name: Разложить вышедшее по темам библиотеки
        if: always()
        continue-on-error: true
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
          UCP_TOPICS_MAX: "10"
        run: |
          python3 bot/ucp_topics.py || true
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && git pull --rebase && git push)
