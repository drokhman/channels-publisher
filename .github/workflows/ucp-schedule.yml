name: УЦП расписание
# Публикует посты @nscspr из scheduled-ucp/ в их время. Строки cron пишет bot/ucp_cron.py — руками не править.
on:
  schedule:
    - cron: '56 5 29 10 *'   # 2026-10-29-0856-ozon-fires-pallets.json · пост
    - cron: '21 6 29 10 *'   # 2026-10-29-0856-ozon-fires-pallets.json · страховка
    - cron: '8 7 29 10 *'   # 2026-10-29-1008-ups-q3.json · пост
    - cron: '33 7 29 10 *'   # 2026-10-29-1008-ups-q3.json · страховка
    - cron: '20 8 29 10 *'   # 2026-10-29-1120-repost-ai-advisor.json · пост
    - cron: '45 8 29 10 *'   # 2026-10-29-1120-repost-ai-advisor.json · страховка
    - cron: '45 9 29 10 *'   # 2026-10-29-1245-events-nov.json · пост
    - cron: '10 10 29 10 *'   # 2026-10-29-1245-events-nov.json · страховка
    - cron: '13 11 29 10 *'   # 2026-10-29-1413-release-0517-flow.json · пост
    - cron: '38 11 29 10 *'   # 2026-10-29-1413-release-0517-flow.json · страховка
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-schedule
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий main, а не коммит запуска: иначе повтор поста
      - name: Опубликовать пост, чьё время наступило
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_schedule.py
      - name: Сохранить результат
        run: |
          git config user.name "ucp-schedule (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A scheduled-ucp*
          git diff --cached --quiet || (git commit -m "УЦП: пост по расписанию" && git pull --rebase && git push)
