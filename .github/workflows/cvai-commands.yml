name: ЧvsИИ команды
on:
  push:
    branches: [main]
    paths: ['commands-cvai/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cvai-commands
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Выполнить команды
        env:
          CVAI_BOT_TOKEN: ${{ secrets.CVAI_BOT_TOKEN }}
        run: python3 bot/cvai_commands.py
      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "cvai-commands (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A commands-cvai commands-cvai-done
          git diff --cached --quiet || (git commit -m "ЧvsИИ: результат команд" && for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*4)); done; exit 1)
