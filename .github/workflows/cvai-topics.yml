name: ЧvsИИ рубрикатор
on:
  push:
    branches: [main]
    paths: ['sent/*cvai*.json', 'config/cvai-topics.json']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cvai-topics
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Разложить посты по темам
        env:
          CVAI_BOT_TOKEN: ${{ secrets.CVAI_BOT_TOKEN || secrets.UCP_BOT_TOKEN }}
        run: python3 bot/cvai_topics.py
      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "cvai-topics (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add topics-cvai config/cvai-topics.json
          git diff --cached --quiet || (git commit -m "ЧvsИИ: рубрикатор" && git pull --rebase && git push)
