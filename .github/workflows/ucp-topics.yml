name: УЦП рубрикатор
on:
  push:
    branches: [main]
    paths: ['scheduled-ucp-done/*.json', 'commands-ucp-done/*.json', 'config/ucp-topics.json']
  # Без расписания: рубрикатор уже встроен в «УЦП расписание» и идёт после каждого поста.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucp-topics
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Разложить посты по темам
        env:
          UCP_BOT_TOKEN: ${{ secrets.UCP_BOT_TOKEN }}
        run: python3 bot/ucp_topics.py
      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "ucp-topics (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- topics-ucp config/ucp-topics.json
          git diff --cached --quiet || (git commit -m "УЦП: рубрикатор" && for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*4)); done; exit 1)
